<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b10">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../global/theme.css">
    <link rel="stylesheet" href="index.css">
    <title>Contact · Jerry Ng</title>
</head>

<body data-page="contact">
    <main class="page container">
        <header class="text-center mb-5 reveal">
            <p class="section-eyebrow mb-2">~$ ping jerry</p>
            <h1 class="section-title display-5"><span class="text-gradient">Contact Me</span></h1>
            <p class="text-muted mx-auto mt-3" style="max-width: 520px;">
                Got a project, a role, or just want to say hi? Drop a message and I'll get back to you.
            </p>
        </header>

        <div class="row g-4 justify-content-center">
            <div class="col-lg-7 reveal d1">
                <form id="contact-form" class="terminal" novalidate>
                    <div class="terminal-bar"><span class="tab"><i class="bi bi-terminal"></i> new_message.sh <i class="bi bi-x tab-close" aria-hidden="true"></i></span></div>
                    <div class="p-4">
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label for="first-name" class="form-label">First name</label>
                                <input id="first-name" name="firstName" type="text" class="form-control" required autocomplete="given-name">
                            </div>
                            <div class="col-sm-6">
                                <label for="last-name" class="form-label">Last name</label>
                                <input id="last-name" name="lastName" type="text" class="form-control" autocomplete="family-name">
                            </div>
                            <div class="col-12">
                                <label for="email" class="form-label">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input id="email" name="email" type="email" class="form-control" required autocomplete="email">
                                </div>
                            </div>
                            <div class="col-12">
                                <label for="message" class="form-label">Message</label>
                                <textarea id="message" name="message" rows="6" class="form-control" required maxlength="1000"></textarea>
                                <div class="form-text mono text-end" id="char-count">0 / 1000</div>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 justify-content-end mt-4">
                            <button type="reset" class="btn btn-ghost">Reset</button>
                            <button type="submit" class="btn btn-glow">Send <i class="bi bi-send ms-1"></i></button>
                        </div>
                        <p id="form-status" class="mono small mt-3 mb-0" role="status"></p>
                    </div>
                </form>
            </div>

            <div class="col-lg-4 reveal d2">
                <div class="panel p-4 mb-4">
                    <p class="block-label mono">Email</p>
                    <a class="contact-link" href="mailto:jerryngsw2@gmail.com">jerryngsw2@gmail.com</a>
                </div>
                <div class="panel p-4 mb-4">
                    <p class="block-label mono">Socials</p>
                    <div class="d-flex flex-column gap-2">
                        <a class="contact-link" href="https://www.linkedin.com/in/jerry-ng-05ab18211/" target="_blank" rel="noopener"><i class="bi bi-linkedin me-2"></i>LinkedIn</a>
                        <a class="contact-link" href="https://www.instagram.com/just_jerryng/" target="_blank" rel="noopener"><i class="bi bi-instagram me-2"></i>Instagram</a>
                        <a class="contact-link" href="https://github.com/Jer-ryy" target="_blank" rel="noopener"><i class="bi bi-github me-2"></i>GitHub</a>
                    </div>
                </div>
                <div class="panel p-4">
                    <p class="block-label mono">Based in</p>
                    <p class="mb-0">Singapore <span class="text-muted">· GMT+8</span></p>
                </div>
            </div>
        </div>
    </main>

    <script src="../global/layout.js"></script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
</body>

</html>
