<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b10">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../global/theme.css">
    <link rel="stylesheet" href="index.css">
    <title>Projects · Jerry Ng</title>
</head>

<body data-page="projects">
    <main class="page container">
        <header class="text-center mb-5 reveal">
            <p class="section-eyebrow mb-2">~$ ls ./projects</p>
            <h1 class="section-title display-5"><span class="text-gradient">Projects</span></h1>
            <p class="text-muted mx-auto mt-3" style="max-width: 560px;">
                A mix of design and development work.
            </p>
        </header>

        <div class="filters reveal d1" role="tablist" aria-label="Filter projects">
            <button type="button" class="filter active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="design">Design</button>
            <button type="button" class="filter" data-filter="web">Web</button>
        </div>

        <div class="row g-4 justify-content-center reveal d2" id="project-grid"></div>
    </main>

    <script src="../global/layout.js"></script>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
</body>

</html>
